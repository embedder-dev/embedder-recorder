# Debug build
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Logging via UART (ST-Link VCP)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# SEGGER RTT for trace data only
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=4

# GPIO for LED heartbeat
CONFIG_GPIO=y

# Random numbers for simulated workloads
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Zephyr tracing hooks
CONFIG_TRACING_USER=y

# Embedder tracing module
CONFIG_EMBEDDER_TRACE=y
CONFIG_EMBEDDER_TRACE_TRANSPORT_RTT=y
CONFIG_EMBEDDER_TRACE_RTT_BUFFER_SIZE=131072
CONFIG_EMBEDDER_TRACE_USER_EVENTS=y
CONFIG_EMBEDDER_TRACE_RICH_EVENTS=y
