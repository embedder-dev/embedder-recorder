# nRF9160 DK GNSS Demo with Embedder Tracing

# Debug build
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Modem & GNSS
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_ONBOARD=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# UART console (nRF9160 DK has dedicated UART over USB)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# RTT for trace data only. Keep Zephyr logs off RTT so channel 0 cannot
# backpressure application threads while trace capture only drains channel 2.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=4

# GPIO for LED heartbeat
CONFIG_GPIO=y

# Entropy for random sleep intervals
CONFIG_ENTROPY_GENERATOR=y

# Heap for modem library
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Main thread stack (modem init needs headroom)
CONFIG_MAIN_STACK_SIZE=4096

# Zephyr tracing — USER mode (embedder-trace provides the hooks)
CONFIG_TRACING_USER=y

# Embedder tracing module
CONFIG_EMBEDDER_TRACE=y
CONFIG_EMBEDDER_TRACE_TRANSPORT_RTT=y
CONFIG_EMBEDDER_TRACE_RTT_BUFFER_SIZE=131072
CONFIG_EMBEDDER_TRACE_USER_EVENTS=y
CONFIG_EMBEDDER_TRACE_RICH_EVENTS=y
